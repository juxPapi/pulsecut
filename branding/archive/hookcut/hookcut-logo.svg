<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="HookCut logo">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C8FF3D" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#C8FF3D" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C8FF3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#080A0E"/>
  <circle cx="600" cy="420" r="350" fill="url(#glow)"/>

  <!-- App mark: a play button sliced by a lime cut. -->
  <g transform="translate(430 250) scale(0.6640625)">
    <rect width="512" height="512" rx="116" fill="#C8FF3D"/>
    <path d="M170 132 L398 256 L170 380 Z" fill="#0B0D11"/>
    <path d="M182 398 L392 120" fill="none" stroke="#C8FF3D" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="786" text-anchor="middle" font-family="'Segoe UI', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="160" letter-spacing="-4">
    <tspan fill="#F2F5FA">HOOK</tspan><tspan fill="#C8FF3D">CUT</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="866" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="21" letter-spacing="7" fill="#8790A1">LONG VIDEOS IN. SHORT CLIPS OUT.</text>

  <path d="M540 936 L660 936" fill="none" stroke="#C8FF3D" stroke-width="3" stroke-linecap="round"/>
</svg>
