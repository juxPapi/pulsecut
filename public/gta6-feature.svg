    <path d="M112 36c24-24 52-34 92-34h30c32 0 54 12 70 34Z" fill="#1a2533"/>
    <path d="M40 92h40v14H40ZM252 92h40v14h-40Z" fill="#ff5a47" opacity="0.85"/>
    <circle cx="82" cy="122" r="24" fill="#06080c" stroke="#39445a" stroke-width="5"/>
    <circle cx="250" cy="122" r="24" fill="#06080c" stroke="#39445a" stroke-width="5"/>
    <path d="M124 42c18-12 38-16 62-16h16c20 0 34 5 45 14Z" fill="#4d6b86" opacity="0.45"/>
  </g>

